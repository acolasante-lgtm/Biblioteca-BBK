<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1a15">
<title>Escáner de Biblioteca</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<style>
/* Escáner a pantalla completa: la cámara ocupa todo, con un marco de mira y una barra inferior */
:root{ --bg:#0f1a15; --ink:#EEF3F0; --muted:#A9B8B0; --accent:#72C4A1; --accent-ink:#0D1913; --warn:#E4B866; --r:12px;
  --f:"Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--f)}
[hidden]{display:none!important}
.wrap{position:fixed;inset:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;background:rgba(15,26,21,.85);z-index:2}
.top img{width:28px;height:auto}
.top b{font-size:1.05rem}
.top span{margin-left:auto;font-size:.8rem;color:var(--muted)}
.stage{position:relative;flex:1;overflow:hidden;background:#000}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.aim{position:absolute;left:50%;top:50%;width:min(70vw,70vh,320px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:18px;box-shadow:0 0 0 9999px rgba(0,0,0,.45);outline:3px solid rgba(255,255,255,.9)}
.aim.hit{outline-color:var(--accent);outline-width:5px}
.bar{padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;background:rgba(15,26,21,.92)}
.msg{font-weight:600;text-align:center;min-height:1.4em}
.msg.warn{color:var(--warn)}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.btn{border:1px solid rgba(255,255,255,.25);background:transparent;color:var(--ink);padding:10px 14px;border-radius:var(--r);font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.setup{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--bg);z-index:3}
.card{max-width:440px;width:100%;display:flex;flex-direction:column;gap:12px}
.card h1{font-size:1.3rem;margin:0}
.card p{margin:0;color:var(--muted);line-height:1.5}
.card input{width:100%;padding:12px;border-radius:var(--r);border:1px solid rgba(255,255,255,.25);background:#17241e;color:var(--ink);font:inherit}
.manual{display:flex;gap:8px}
.manual input{flex:1;min-width:0;padding:10px 12px;border-radius:var(--r);border:1px solid rgba(255,255,255,.25);background:#17241e;color:var(--ink);font:inherit;text-transform:uppercase}
</style>
</head>

if(params.get('app')) store.set('appUrl', params.get('app'));
let stream = null, raf = 0, devices = [], devIdx = 0, done = false, detector = null;

function msg(t, warn){ const m=$('#msg'); m.textContent=t; m.className='msg'+(warn?' warn':''); }
function showApp(){
  if(!app) return;
  try{ $('#appHost').textContent = new URL(app).hostname; }catch(e){}
  $('#backApp').href = app;
}
function extractCode(raw){
  let s = String(raw||'').trim();
  const m = s.match(/codigo[^A-Za-z0-9]*([A-Za-z0-9_.\-]+)\s*$/i);
  if(m) return decodeURIComponent(m[1]).toUpperCase();
  if(/^https?:\/\//i.test(s)) return '';
  return s.toUpperCase();
}
function go(code){
  if(done || !code) return;
  done = true;
  $('#aim').classList.add('hit'); if(navigator.vibrate) navigator.vibrate(80);
  msg('Leído: ' + code + '. Abriendo la aplicación…');
  stop();
  location.href = app + (app.includes('?') ? '&' : '?') + 'codigo=' + encodeURIComponent(code);
}
function stop(){ cancelAnimationFrame(raf); if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; } }

async function start(){
  stop(); done = false; $('#aim').classList.remove('hit');
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ msg('Este navegador no permite usar la cámara. Probá con Chrome o Safari actualizados.', true); return; }
  const constraints = devices.length ? {deviceId:{exact:devices[devIdx].deviceId}} : {facingMode:{ideal:'environment'}};
  try{
    stream = await navigator.mediaDevices.getUserMedia({video:Object.assign({width:{ideal:1280},height:{ideal:720}}, constraints), audio:false});
  }catch(e){
    msg(e && e.name==='NotAllowedError' ? 'No hay permiso para usar la cámara. Habilitalo en la configuración del navegador para este sitio y recargá la página.'
      : e && e.name==='NotFoundError' ? 'No se encontró ninguna cámara en este equipo.'
      : 'No se pudo abrir la cámara. Cerrá otras aplicaciones que la estén usando y recargá.', true);
    return;
  }
  const v = $('#video'); v.srcObject = stream; await v.play().catch(()=>{});
  try{
    if(!devices.length){ devices = (await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput'); }
    $('#switchCam').hidden = devices.length < 2;
    const track = stream.getVideoTracks()[0];
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    $('#torch').hidden = !caps.torch;
  }catch(e){}
  msg('Apuntá la cámara al código QR del libro');
  if('BarcodeDetector' in window){ try{ detector = new BarcodeDetector({formats:['qr_code']}); }catch(e){ detector = null; } }
  scan();
}
const cv = document.createElement('canvas'); const cx = cv.getContext('2d', {willReadFrequently:true});
let busy = false;
function scan(){
  if(!stream || done) return;
  const v = $('#video');
  if(v.readyState >= 2 && !busy){
    if(detector){
      busy = true;
      detector.detect(v).then(r=>{ busy=false; if(r && r[0]) go(extractCode(r[0].rawValue)); }).catch(()=>{ busy=false; detector=null; });
    } else if(window.jsQR){
      const sc = Math.min(1, 720/Math.max(v.videoWidth, v.videoHeight));
      cv.width = Math.round(v.videoWidth*sc); cv.height = Math.round(v.videoHeight*sc);
      cx.drawImage(v, 0, 0, cv.width, cv.height);
      const r = jsQR(cx.getImageData(0,0,cv.width,cv.height).data, cv.width, cv.height, {inversionAttempts:'dontInvert'});
      if(r && r.data) go(extractCode(r.data));
    }
  }
  raf = requestAnimationFrame(scan);
}
$('#switchCam').addEventListener('click', ()=>{ devIdx = (devIdx+1) % devices.length; start(); });
let torchOn = false;
$('#torch').addEventListener('click', async ()=>{
  try{ torchOn = !torchOn; await stream.getVideoTracks()[0].applyConstraints({advanced:[{torch:torchOn}]}); }catch(e){ $('#torch').hidden = true; }
});
$('#manual').addEventListener('submit', e=>{ e.preventDefault(); go(extractCode($('#manualCode').value)); });
$('#setupForm').addEventListener('submit', e=>{
  e.preventDefault();
  const u = $('#appUrl').value.trim();
  if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(u)){ alertBox('El link tiene que empezar con https://script.google.com/ y terminar en /exec.'); return; }
  app = u; store.set('appUrl', u); $('#setup').hidden = true; showApp(); start();
});
function alertBox(t){ msg(t, true); }
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible' && !stream && app && !done) start(); else if(document.visibilityState==='hidden') stop(); });
window.addEventListener('pageshow', e=>{ if(e.persisted && app){ done=false; start(); } });

if(!app){ $('#setup').hidden = false; msg('Falta configurar el link de la aplicación', true); }
else { showApp(); start(); }
})();
</script>
</body>
</html>
